<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday ♥ — a little film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a2420; --rose:#e8447f; --crimson:#c2185b; --gold:#f2b84b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #f1e8df; overflow: hidden; color: var(--ink);
         font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; }
  #stage { position: relative; width: 100%; height: 100dvh; overflow: hidden;
    background:
      radial-gradient(ellipse 55% 45% at 15% 88%, rgba(232,230,180,.75), transparent 70%),
      radial-gradient(ellipse 70% 60% at 50% 40%, #faf4ec, #eadfd5); }
  .small { font-size: clamp(1.05rem, 3.4vw, 1.35rem); letter-spacing: .02em; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- Scene 1: bow, arrow, heart ---------- */
  .s1 { transition: opacity .4s; }
  #stage[data-s=wish] .s1, #stage[data-s=bloom] .s1 { opacity: 0; }
  .center { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%);
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .heart { position: relative; display: block; width: clamp(84px, 17vmin, 140px); aspect-ratio: 1;
    background: none; border: 0; padding: 0; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
  .heart:focus-visible { outline: 2px dashed var(--crimson); outline-offset: 10px; border-radius: 12px; }
  .hint { margin-top: -.4rem; opacity: 0; transition: opacity .8s 1.2s; }
  #stage[data-s=intro] .hint { opacity: .75; }
  #stage.fired .hint { opacity: 0; transition-delay: 0s; }
  .heart::before { content: ""; position: absolute; inset: -90%;
    background: radial-gradient(circle, rgba(232,68,127,.32), transparent 62%); }
  .heart svg { position: relative; width: 100%; height: 100%; overflow: visible;
    filter: drop-shadow(0 8px 10px rgba(160,20,70,.3)); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 50% { scale: 1.06; } }
  .heart.hit { animation: shake .35s; }
  @keyframes shake { 25% { translate: -5px 2px; } 50% { translate: 5px -2px; } 75% { translate: -3px 1px; } }
  .heart.gone svg { opacity: 0; scale: 1.5; transition: opacity .25s, scale .25s; }

  .archer { position: absolute; left: 15%; bottom: 7%; width: clamp(110px, 20vw, 170px); aspect-ratio: 1;
    pointer-events: none; transform-origin: 12% 50%; transform: rotate(var(--aim, 0rad)); }
  .archer svg { width: 100%; height: 100%; overflow: visible; }
  .archer .arrow { position: absolute; left: 12%; top: 50%; width: 80%; height: auto; aspect-ratio: 120 / 14;
    margin-top: -4.667%; overflow: visible; }
  .archer.shot .arrow { transform: translateX(var(--d)); transition: transform .42s cubic-bezier(.12,.6,.35,1); }
  .archer.shot .bow { animation: kick .4s ease-out; }
  @keyframes kick { 15% { translate: -5px 0; } 100% { translate: 0 0; } }
  .ripple { position: absolute; left: 30%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border: 2px solid var(--rose); border-radius: 50%; opacity: 0; }
  .archer.shot .ripple { animation: ripple .65s ease-out; }
  .archer.shot .r2 { animation-delay: .1s; }
  @keyframes ripple { 0% { opacity: .85; transform: scale(.3); } 100% { opacity: 0; transform: scale(2.8); } }
  .archer.gone .arrow { opacity: 0; transition: opacity .4s; }

  /* ---------- Scene 2: crimson wipe + wish ---------- */
  .wipe { z-index: 1; background: linear-gradient(120deg, #ec4a86, #b3003f 60%, #8f0a3a);
    clip-path: circle(0% at var(--hx, 50%) var(--hy, 40%)); }
  #stage[data-s=wish] .wipe { clip-path: circle(150% at var(--hx, 50%) var(--hy, 40%));
    transition: clip-path 1s cubic-bezier(.7,0,.2,1); }
  #stage[data-s=bloom] .wipe { transition: clip-path 1s cubic-bezier(.7,0,.2,1) .2s; }

  .card { z-index: 2; display: grid; place-content: center; justify-items: center; text-align: center;
    color: #f7eef1; opacity: 0; pointer-events: none; transition: opacity .5s; padding: 1rem; }
  #stage[data-s=wish] .card { opacity: 1; transition-delay: .6s; }
  .card > * { opacity: 0; transform: translateY(14px); transition: opacity .8s, transform .8s; }
  #stage[data-s=wish] .card > * { opacity: 1; transform: none; }
  #stage[data-s=wish] .card > :nth-child(1) { transition-delay: .9s; }
  #stage[data-s=wish] .card > :nth-child(2) { transition-delay: 1.3s; }
  #stage[data-s=wish] .card > :nth-child(4) { transition-delay: 2.3s; }
  .card h1 { font: 700 clamp(3.4rem, 17vw, 8rem)/.95 "Bodoni Moda", Didot, "Bodoni 72", serif;
    letter-spacing: -.02em; margin: .7rem 0 .4rem; text-shadow: 0 4px 24px rgba(80,0,30,.35); }
  .swoosh { width: min(58vw, 320px); height: 22px; overflow: visible; opacity: 1 !important; transform: none !important; }
  .swoosh path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  #stage[data-s=wish] .swoosh path { stroke-dashoffset: 0; transition: stroke-dashoffset 1s ease-out 1.8s; }

  /* ---------- Scene 3: the tree ---------- */
  .s4 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem;
        opacity: 0; transition: opacity .6s; }
  #stage[data-s=bloom] .s4 { opacity: 1; transition-delay: .4s; }
  .tree { width: min(92vw, 430px); max-height: 58vh; overflow: visible; }
  .tp { fill: none; stroke: inherit; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .trunk { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); }
  #stage[data-s=bloom] .trunk { transform: none; transition: transform 1.1s cubic-bezier(.3,.7,.2,1) .4s; }
  #stage[data-s=bloom] .tp { stroke-dashoffset: 0; transition: stroke-dashoffset var(--t) ease-out var(--d); }
  .leaf { opacity: 0; transform-box: fill-box; transform-origin: center; }
  #stage[data-s=bloom] .leaf { animation: pop .6s cubic-bezier(.3,1.6,.5,1) var(--dl) both; }
  @keyframes pop { from { opacity: 0; transform: rotate(var(--r)) scale(0); }
                   to   { opacity: 1; transform: rotate(var(--r)) scale(1); } }
  .bless { text-align: center; opacity: 0; transition: opacity 1s; }
  #stage[data-s=bloom] .bless { opacity: 1; transition-delay: 3.6s; }
  .script { font: 400 clamp(3rem, 14vw, 5rem)/1.1 "Great Vibes", cursive; font-style: normal; color: var(--crimson); }

  #to { font-size: clamp(1.3rem, 5vw, 1.8rem); max-width: min(82vw, 24ch); text-wrap: balance; margin-top: .3rem; }

  .balloons { overflow: hidden; opacity: 0; }
  #stage[data-s=bloom] .balloons { opacity: 1; transition: opacity 1s 1.5s; }
  .balloon { position: absolute; bottom: -28%; left: var(--l); width: var(--w); }
  .balloon svg { display: block; width: 100%; height: auto; transform-origin: 50% 100%; }
  #stage[data-s=bloom] .balloon { animation: rise var(--t) linear var(--dl) infinite; }
  #stage[data-s=bloom] .balloon svg { animation: bsway var(--sw) ease-in-out infinite alternate; }
  @keyframes rise { to { transform: translate(var(--x), -150vh); } }
  @keyframes bsway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .bit { position: fixed; width: 16px; height: 16px; }
  .again { position: fixed; right: 1rem; bottom: .8rem; z-index: 6; background: none; border: 0;
    font: italic 1.1rem "Cormorant Garamond", Georgia, serif; color: #7a4a50; text-decoration: underline;
    cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .6s; }
  .again.on { opacity: .85; pointer-events: auto; }
  .again:focus-visible { outline: 2px solid var(--crimson); outline-offset: 3px; }

  .still *, .still *::before { animation: none !important; transition: none !important; }
  .still .tp { stroke-dashoffset: 0; } .still .trunk { transform: none; } .still .leaf, .still .bless, .still .s4 { opacity: 1; }
  .still .balloons { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="hg" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff8fb7"/><stop offset=".55" stop-color="#d81b60"/><stop offset="1" stop-color="#9c1040"/>
    </radialGradient>
    <symbol id="hrt" viewBox="0 0 100 100"><path d="M50 90C8 58 0 34 14 20C27 7 44 12 50 27C56 12 73 7 86 20C100 34 92 58 50 90Z"/></symbol>
    <symbol id="leaf" viewBox="0 0 100 100"><path d="M50 90C8 58 0 34 14 20C27 7 44 12 50 27C56 12 73 7 86 20C100 34 92 58 50 90Z"/><ellipse cx="31" cy="29" rx="8" ry="5" fill="#fff" opacity=".4" transform="rotate(-30 31 29)"/></symbol>
  </defs>
</svg>

<main id="stage" data-s="intro">
  <section class="layer s1">
    <div class="center">
      <p class="small">a little something, for you</p>
      <button type="button" class="heart" id="heart" aria-label="Tap the heart to release the arrow">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <use href="#hrt" fill="url(#hg)"/>
          <ellipse cx="32" cy="30" rx="9" ry="6" fill="#fff" opacity=".7" transform="rotate(-30 32 30)"/>
        </svg>
      </button>
      <p class="small hint">tap the heart</p>
    </div>
    <div class="archer" id="archer" aria-hidden="true">
      <svg class="bow" viewBox="0 0 100 100" aria-hidden="true">
        <path id="bowarc" d="M27.8 4Q96 50 27.8 96" fill="none" stroke="#5a3a2a" stroke-width="4" stroke-linecap="round"/>
        <path id="string" d="M27.8 4L12 50L27.8 96" fill="none" stroke="#5a3a2a" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <i class="ripple"></i><i class="ripple r2"></i>
      <svg class="arrow" viewBox="0 0 120 14" aria-hidden="true">
        <line x1="6" y1="7" x2="108" y2="7" stroke="#5a3a2a" stroke-width="2" stroke-linecap="round"/>
        <path d="M104 1L120 7L104 13Z" fill="#c2185b"/>
        <path d="M0 1L14 7L0 13L5 7Z" fill="#f2b84b"/>
      </svg>
    </div>
  </section>

  <div class="layer balloons" id="balloons"></div>

  <section class="layer s4">
    <svg class="tree" viewBox="0 0 400 480" aria-hidden="true">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#ff9ebe" stop-opacity=".38"/><stop offset="1" stop-color="#ff9ebe" stop-opacity="0"/></radialGradient>
        <linearGradient id="bark"><stop offset="0" stop-color="#70493a"/><stop offset=".55" stop-color="#4a2e26"/><stop offset="1" stop-color="#2f1c17"/></linearGradient>
        <linearGradient id="hill" x2="0" y2="1"><stop offset="0" stop-color="#d9ebcb"/><stop offset="1" stop-color="#b6d2a6"/></linearGradient>
      </defs>
      <circle cx="200" cy="185" r="195" fill="url(#glow)"/>
      <ellipse cx="200" cy="470" rx="230" ry="14" fill="url(#hill)"/>
      <path d="M50 472q-1-9-5-13M50 472q1-11 1-15M50 472q3-8 7-11M105 472q-1-9-5-13M105 472q1-11 1-15M105 472q3-8 7-11M150 472q-1-9-5-13M150 472q1-11 1-15M150 472q3-8 7-11M255 472q-1-9-5-13M255 472q1-11 1-15M255 472q3-8 7-11M300 472q-1-9-5-13M300 472q1-11 1-15M300 472q3-8 7-11M350 472q-1-9-5-13M350 472q1-11 1-15M350 472q3-8 7-11" fill="none" stroke="#8fb583" stroke-width="2" stroke-linecap="round"/>
      <g fill="#ff9ebe"><circle cx="80" cy="470" r="2.6"/><circle cx="170" cy="476" r="2.2"/><circle cx="275" cy="473" r="2.6"/></g>
      <g fill="#f2b84b"><circle cx="128" cy="474" r="2.4"/><circle cx="322" cy="469" r="2.4"/></g>
      <path class="trunk" fill="url(#bark)" d="M176 478C189 470 194 452 195 430C196 400 195 360 195 332L205 332C205 360 204 400 206 430C207 452 213 470 226 478Z"/>
      <g stroke="#4a2e26" class="branches">
        <path class="tp" pathLength="1" stroke-width="7" style="--d:1.3s;--t:1.2s" d="M200 340C200 300 190 270 150 235C130 215 112 190 108 160"/>
        <path class="tp" pathLength="1" stroke-width="7" style="--d:1.3s;--t:1.2s" d="M200 340C202 300 212 270 250 235C270 215 288 190 292 160"/>
        <path class="tp" pathLength="1" stroke-width="6" style="--d:1.3s;--t:1.3s" d="M200 335C198 280 200 220 200 150"/>
        <path class="tp" pathLength="1" stroke-width="4" style="--d:2s;--t:.8s" d="M190 292C165 287 140 292 120 277"/>
        <path class="tp" pathLength="1" stroke-width="4" style="--d:2s;--t:.8s" d="M210 292C235 287 260 292 280 277"/>
        <path class="tp" pathLength="1" stroke-width="3" style="--d:2.4s;--t:.7s" d="M108 160C100 140 108 120 122 108"/>
        <path class="tp" pathLength="1" stroke-width="3" style="--d:2.4s;--t:.7s" d="M292 160C300 140 292 120 278 108"/>
        <path class="tp" pathLength="1" stroke-width="3" style="--d:2.4s;--t:.7s" d="M200 150C190 130 175 118 160 108"/>
        <path class="tp" pathLength="1" stroke-width="3" style="--d:2.4s;--t:.7s" d="M200 150C210 130 225 118 240 108"/>
      </g>
      <g id="canopy"></g>
    </svg>
    <div class="bless">
      <p class="small">…make it count</p>
      <h2 class="script">Happy Birthday</h2>
      <p class="small">Here’s to a year that blooms</p>
    </div>
  </section>

  <div class="layer wipe"></div>
  <section class="layer card">
    <p class="small">make a wish…</p>
    <h1>Happy<br>Birthday</h1>
    <svg class="swoosh" viewBox="0 0 300 22" aria-hidden="true">
      <path pathLength="1" d="M4 15C70 5 190 3 290 11C250 8 200 14 150 20" fill="none" stroke="#f2b84b" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="small" id="to">Tanwi or should I call you trishna?</p>
  </section>

</main>
<div id="fx"></div>
<button class="again" id="again" type="button">watch again</button>


<script>
  const $ = s => document.querySelector(s);
  const stage = $("#stage"), archer = $("#archer"), heart = $("#heart"), again = $("#again");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const NS = "http://www.w3.org/2000/svg";
  const rnd = (a, b) => a + Math.random() * (b - a);


  // Heart-shaped canopy of little hearts
  const cols = ["#e8447f", "#f06a9b", "#ff9ebe", "#d81b60", "#f2b84b", "#f7d27a"];
  const leafCols = ["#e8447f", "#e8447f", "#f06a9b", "#f06a9b", "#ff9ebe", "#d81b60", "#f2b84b", "#f7d27a"];
  const pts = [];
  while (pts.length < 190) {
    const x = rnd(-1.3, 1.3), y = rnd(-1.15, 1.25);
    if (Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0) pts.push([200 + x * 92, 190 - y * 92]);
  }
  pts.sort((a, b) => Math.hypot(a[0] - 200, a[1] - 190) - Math.hypot(b[0] - 200, b[1] - 190));
  pts.forEach(([x, y], i) => {
    const g = document.createElementNS(NS, "g"), u = document.createElementNS(NS, "use"), s = rnd(15, 28);
    g.setAttribute("transform", `translate(${x} ${y})`);
    Object.entries({ href: "#leaf", x: -s / 2, y: -s / 2, width: s, height: s, class: "leaf",
                     fill: leafCols[Math.floor(Math.random() * leafCols.length)] }).forEach(([k, v]) => u.setAttribute(k, v));
    u.style.setProperty("--r", rnd(-35, 35) + "deg");
    u.style.setProperty("--dl", (2.4 + i / pts.length * 1.6) + "s");
    g.appendChild(u); $("#canopy").appendChild(g);
  });

  // Balloons that drift up behind the tree
  const bcols = ["#e8447f", "#ff8fb7", "#f2b84b", "#7fd8b8", "#b69af0", "#ff7a6b"];
  for (let i = 0; i < 12; i++) {
    const b = document.createElement("div"), c = bcols[i % bcols.length]; b.className = "balloon";
    b.style.cssText = `--l:${(i + .5) * (90 / 12) + rnd(-2, 2)}%;--w:${rnd(40, 64)}px;--t:${rnd(12, 19)}s;--dl:${rnd(.5, 8)}s;--x:${rnd(-50, 50)}px;--sw:${rnd(2.4, 4)}s`;
    b.innerHTML = `<svg viewBox="0 0 40 100" aria-hidden="true"><path d="M20 2C31 2 38 11 38 22C38 34 28 43 20 45C12 43 2 34 2 22C2 11 9 2 20 2Z" fill="${c}"/>` +
      `<ellipse cx="12" cy="14" rx="3.6" ry="7" fill="#fff" opacity=".45" transform="rotate(25 12 14)"/>` +
      `<path d="M20 44l-3.5 5h7z" fill="${c}"/><path d="M20 49q-6 10 0 20t0 24" fill="none" stroke="#7a5560" stroke-width="1"/></svg>`;
    $("#balloons").appendChild(b);
  }

  // Aim the bow at the heart
  function aim() {
    archer.style.setProperty("--aim", "0rad");
    const r = archer.getBoundingClientRect(), h = heart.getBoundingClientRect();
    const nx = r.left + r.width * .12, ny = r.top + r.height * .5;
    const hx = h.left + h.width / 2, hy = h.top + h.height / 2;
    const len = $(".arrow").getBoundingClientRect().width;
    archer.style.setProperty("--aim", Math.atan2(hy - ny, hx - nx) + "rad");
    archer.style.setProperty("--d", (Math.hypot(hx - nx, hy - ny) - len * .7) + "px");
    stage.style.setProperty("--hx", hx + "px"); stage.style.setProperty("--hy", hy + "px");
  }

  // Bow string: held pulled back, then snaps and vibrates (damped wiggle) on release
  const bowArc = $("#bowarc"), string = $("#string");
  function setString(off) {
    const tip = 30 + off * .12;
    bowArc.setAttribute("d", `M${tip} 4Q96 50 ${tip} 96`);
    string.setAttribute("d", `M${tip} 4L${30 + off} 50L${tip} 96`);
  }
  function twang() {
    const t0 = performance.now();
    (function frame(now) {
      const t = (now - t0) / 1000;
      if (t > .7) return setString(0);
      setString(-18 * Math.exp(-7 * t) * Math.cos(2 * Math.PI * 11 * t));
      requestAnimationFrame(frame);
    })(t0);
  }

  function burst() {
    const h = heart.getBoundingClientRect(), cx = h.left + h.width / 2, cy = h.top + h.height / 2;
    for (let i = 0; i < 28; i++) {
      const b = document.createElement("div"); b.className = "bit";
      b.style.cssText = `left:${cx - 8}px;top:${cy - 8}px`;
      b.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#hrt" fill="${cols[i % cols.length]}"/></svg>`;
      $("#fx").appendChild(b);
      const a = rnd(0, Math.PI * 2), d = rnd(60, 190);
      b.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 },
                 { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) rotate(${rnd(-200, 200)}deg) scale(.3)`, opacity: 0 }],
                { duration: rnd(800, 1400), easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => b.remove();
    }
  }

  async function play() {
    again.classList.remove("on");
    archer.classList.remove("shot", "gone"); heart.classList.remove("hit", "gone");
    stage.classList.remove("fired");
    stage.dataset.s = "intro"; aim(); setString(-18);
    await new Promise(r => heart.addEventListener("click", r, { once: true }));
    stage.classList.add("fired");
    archer.classList.add("shot"); twang(); await sleep(440);
    heart.classList.add("hit"); await sleep(350);
    burst(); heart.classList.add("gone"); archer.classList.add("gone"); await sleep(500);
    stage.dataset.s = "wish"; await sleep(6500);
    stage.dataset.s = "bloom"; await sleep(6000);
    again.classList.add("on");
  }

  again.addEventListener("click", play);
  addEventListener("resize", () => stage.dataset.s === "intro" && aim());
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { stage.classList.add("still"); stage.dataset.s = "bloom"; }
  else document.fonts.ready.then(play);
</script>
</body>
</html>
